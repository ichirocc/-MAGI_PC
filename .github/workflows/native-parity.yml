name: Native Parity Check

# [backlog#6] C++ 評価器（magi_native.cpp）のパリティ自動テスト。
# host_parity_bench.cpp は Android SDK/NDK 不要の純ホスト C++ で、SaChunk の増分 Δ 評価が
# スカラーの fullEvalCombined（Kotlin オラクルの C++ ミラー）と一致することを合成問題×多シード×
# 約150万手で照合し、mismatch があれば非ゼロ終了する。これを CI で自動実行し、Evaluator.kt を
# 変えて magi_native.cpp を変え忘れる（意味的乖離＝実機で番兵発火→ネイティブ黙殺）回帰を捕捉する。
# [3.357.0] さらに --expect= で **Kotlin と C++ の言語跨ぎ**パリティも照合する。旧来の照合は
# C++ 内部（scalar vs bit-op）だけで、両方の C++ 経路を一貫して変えれば通ってしまい、
# Kotlin との乖離は実機の番兵まで気づけなかった（速度が落ちるだけで結果は正しいので発覚しにくい）。
# g++ のみで数十秒＝軽量なので SDK ジョブとは分離した専用ワークフローにする。
# [3.366.0] shared-handle-tsan ジョブ: runSharedHandleConcurrency（SaOptimizer.run が native
# ハンドル1本を最大8並列ワーカーで叩く実運用と同じ形を再現する検査）のコメントは「TSAN でビルド
# すれば書き込み競合を検出する」と主張していたが、CI はどこも -fsanitize=thread でビルドして
# おらず、この主張を実際に検証する経路が「開発者が手元で --shared-only を思い出して走らせる」
# 一回限りの手作業しか無かった（読んで確認できる契約と実際にCIが守る契約が食い違う＝このリポジトリで
# 何度も踏んだ HF77 と同じ構図）。実測コスト（TSANビルド~7秒＋実行~0.05秒）が無視できる小ささ
# だったため、常時実行の native-parity ジョブへ混ぜずに独立の軽量ジョブとして追加し、コメントの
# 主張を実際にCIが継続的に担保するようにした。

on:
  workflow_dispatch:
  push:
    # main に加えて作業ブランチでも走らせる（g++ のみ・数十秒＝SDK ジョブより桁違いに軽い）。
    # C++ を触った時点でパリティ崩れを検出できるようにする。
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: native-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build parity + bench harness
        shell: bash
        run: |
          mkdir -p build/ci-logs
          g++ -O3 -std=c++17 -DMAGI_HOST_TEST -pthread -I app/src/main/cpp \
            tools/native/host_parity_bench.cpp -o build/magi_host \
            2>&1 | tee build/ci-logs/native-parity-build.log

      # [実データ形状フィクスチャ] 実 state JSON を flat 問題へ変換し、合成フィクスチャに加えて
      # 実データ形状（休シフトの range/apt/c1・c42・任意長c3n・use2 等）でも Δ==フルを照合する
      # （backlog#6 残課題「実データ形状の網羅」への対応）。
      # [3.361.0] golden(hard=0) は C++ の HARD 族パスを実データで一度も exercise しないため、
      #   sample_state_v6(入力盤面 hard=15＝groupViol/c3n/pref/covU 発火) を2つ目の形状として追加。
      - name: Generate real-data fixtures (state JSON → flat)
        shell: bash
        run: |
          python3 tools/native/state_to_flat.py \
            app/src/test/resources/golden_state.json build/golden.flat \
            2>&1 | tee build/ci-logs/native-parity-fixture.log
          python3 tools/native/state_to_flat.py \
            app/src/test/resources/sample_state_v6.json build/sample_v6.flat \
            2>&1 | tee -a build/ci-logs/native-parity-fixture.log

      - name: Run parity check (fails on any mismatch)
        shell: bash
        run: |
          set -o pipefail
          # 非ゼロ終了（mismatch>0）でこのステップ＝ジョブが失敗する。
          # --expect= は Kotlin 側の期待値（NativeParityFixtureTest が同じファイルを検証する）。
          # C++ scalar-vs-bit だけでは「Kotlin と C++ を片側だけ直した」乖離を捕まえられないため、
          # 両側を1つの数字に固定して片側変更を必ず落とす（実測: C++ に +113 の一貫した改変を入れると
          # 旧チェックは 0 mismatch で通り、この --expect だけが MISMATCH で落ちる）。
          # [3.361.0] flat と --expect は**出現順**で対応づく（golden⇔golden_expected,
          #   sample_v6⇔sample_v6_expected）。合成ベンチは1回のまま両形状を言語跨ぎ照合する。
          ./build/magi_host build/golden.flat build/sample_v6.flat \
            --expect=app/src/test/resources/golden_eval_expected.txt \
            --expect=app/src/test/resources/sample_v6_eval_expected.txt \
            2>&1 | tee build/ci-logs/native-parity-run.log

      - name: Upload logs (on failure only)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-parity-logs
          path: build/ci-logs
          if-no-files-found: ignore
          retention-days: 7

  # [3.366.0] TSAN ビルドで runSharedHandleConcurrency の --shared-only を回すだけの軽量ジョブ。
  # native-parity ジョブとは独立（TSAN ビルドは通常ビルドと別コンパイラフラグのため同一ステップに
  # 混ぜない）。1つの flat フィクスチャで十分（この検査は「MagiProblem が読み取り専用で共有安全か」
  # という盤面データに依らない構造的性質を見るもの＝複数フィクスチャを回しても検出力は増えない）。
  shared-handle-tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build harness with ThreadSanitizer
        shell: bash
        run: |
          mkdir -p build/ci-logs
          g++ -O1 -g -std=c++17 -fsanitize=thread -DMAGI_HOST_TEST -I app/src/main/cpp \
            tools/native/host_parity_bench.cpp -o build/magi_host_tsan \
            2>&1 | tee build/ci-logs/shared-handle-tsan-build.log

      - name: Generate fixture (state JSON → flat)
        shell: bash
        run: |
          python3 tools/native/state_to_flat.py \
            app/src/test/resources/golden_state.json build/golden.flat \
            2>&1 | tee build/ci-logs/shared-handle-tsan-fixture.log

      - name: Run shared-handle concurrency check under TSAN
        shell: bash
        run: |
          set -o pipefail
          # TSAN が競合を検出すると非ゼロ終了する。--shared-only は --expect を使わない
          # （このジョブの目的は言語跨ぎパリティでなくスレッド安全性の検証のため）。
          ./build/magi_host_tsan --shared-only build/golden.flat \
            2>&1 | tee build/ci-logs/shared-handle-tsan-run.log

      - name: Upload logs (on failure only)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shared-handle-tsan-logs
          path: build/ci-logs
          if-no-files-found: ignore
          retention-days: 7
