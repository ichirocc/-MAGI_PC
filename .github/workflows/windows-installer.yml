name: Windows Installer

# Windows 11 向けの「インストールできる成果物」を2形態で生成し Artifacts へ保存する。
#
#   ① installer-exe … Inno Setup 製の setup.exe（推奨・証明書不要）
#      WinUI3 を unpackaged（WindowsPackageType=None）＋ self-contained で publish し、
#      ランナー同梱の Inno Setup (ISCC.exe) で per-user インストーラに包む。
#      .NET / WindowsAppSDK ランタイム同梱＝配布先 PC に前提インストール不要。
#      署名なしでも実行可（初回に SmartScreen の「詳細情報→実行」が出るのは仕様）。
#      Secrets に WINDOWS_CERTIFICATE_BASE64 / WINDOWS_CERTIFICATE_PASSWORD があれば
#      signtool で Authenticode 二重署名（中身の .exe → setup.exe、タイムスタンプ付き）。
#      リポジトリ変数 REQUIRE_CODE_SIGNING=true を置くと、公開 Release（タグ win-v* / publish_release）では
#      署名が無い run を publish 前に失敗させる（証明書を導入したら有効化する。既定＝未設定は従来どおり署名なし可）。
#
#   ② msix-package … MSIX サイドロードパッケージ（WinUI3 の正式なパッケージ形態）
#      Secrets に MSIX_PFX_BASE64 / MSIX_PFX_PASSWORD があれば署名付き .msix
#      （ダブルクリックでインストール可。証明書を配布先で1回信頼させる必要あり）。
#      Secrets が無ければ未署名 .msix（開発者モード＋PowerShell の
#      Add-AppxPackage でのみインストール可）を成果物にする。
#      注意: Package.appxmanifest の Publisher (CN=MAGI) と証明書 Subject は一致必須。
#      自己署名証明書の作成例（Windows 上の PowerShell・管理者不要）:
#        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=MAGI" `
#          -KeyUsage DigitalSignature -FriendlyName "MAGI sideload" `
#          -CertStoreLocation "Cert:\CurrentUser\My" `
#          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
#        Export-PfxCertificate -Cert $cert -FilePath magi.pfx `
#          -Password (ConvertTo-SecureString -String "<パスワード>" -Force -AsPlainText)
#        [Convert]::ToBase64String([IO.File]::ReadAllBytes("magi.pfx")) | Set-Clipboard
#      → クリップボードの文字列を Secrets: MSIX_PFX_BASE64 へ、パスワードを MSIX_PFX_PASSWORD へ。
#
#   ③ GitHub Release（タグ win-vX.Y.Z の push、または publish_release 入力）… ①の setup.exe を添付。
#      固定名 MagiShiftOptimizer-Setup-x64.exe も付けるので releases/latest/download/… が常に最新版。
#      入れ方（curl.exe なら MotW が付かず SmartScreen が出ない）は windows/README.md「Windows 11 での入れ方」。
#
# トリガは手動（workflow_dispatch）とリリースタグ（win-v*）のみ。
# 通常 push のビルド検証は windows-app-build.yml が担当（毎 push でインストーラまで
# 作ると windows ランナーの課金分数を浪費するため分離）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "インストーラのバージョン表記（空欄なら Package.appxmanifest の Version を使用）"
        required: false
        default: ""
      publish_release:
        description: "GitHub Release を作る（タグ win-v<版> をこの実行のコミットに打ち、setup.exe を添付。latest URL が更新される）"
        type: boolean
        required: false
        default: false
  push:
    tags: ["win-v*"]

jobs:
  installer-exe:
    name: setup.exe (Inno Setup)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        working-directory: windows
    env:
      # 署名が必須な run＝公開 Release（タグ win-v* / publish_release）かつリポジトリ変数 REQUIRE_CODE_SIGNING=true。
      # release ジョブの本文（署名済み表記）も同じ変数で判定する（そのジョブは公開時にしか動かない）。
      REQUIRE_SIGNING: ${{ (startsWith(github.ref, 'refs/tags/win-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')) && vars.REQUIRE_CODE_SIGNING == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        # [レビュー指摘 2026-09-04] 旧: `$v = "${{ inputs.version }}"` と式展開でスクリプト本文へ埋めていた＝
        #   引用符や改行を含む入力で任意の PowerShell を実行できる（後続ステップが署名証明書を扱う）。
        #   入力は環境変数で受け取り、`X.Y.Z` 形式だけ通す。
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GIT_REF: ${{ github.ref }}
        run: |
          $v = $env:INPUT_VERSION
          # タグ push（refs/tags/win-vX.Y.Z）ならタグが版の正＝appxmanifest を毎回書き換えずに済む。
          if ([string]::IsNullOrWhiteSpace($v) -and $env:GIT_REF -match '^refs/tags/win-v(\d+\.\d+\.\d+)$') { $v = $Matches[1] }
          if ([string]::IsNullOrWhiteSpace($v)) {
            [xml]$m = Get-Content MagiApp.WinUI/Package.appxmanifest
            # appxmanifest は 4 桁 (1.0.0.0)。インストーラ表記は 3 桁へ丸める。
            $v = ($m.Package.Identity.Version -replace '\.\d+$', '')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: '$v' (expected X.Y.Z)" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "installer version = $v"

      - name: Validate release signing policy
        # 署名が必須な run（REQUIRE_CODE_SIGNING=true の公開 Release）で Secrets が無ければ、publish に時間を使う前にここで落とす。
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./installer/sign-files.ps1 -ValidateOnly -RequireSignature:($env:REQUIRE_SIGNING -eq 'true')

      - name: Setup MSBuild
        # dotnet CLI では publish できない（run 33284484499 で実測）: WindowsAppSDK の
        # MrtCore.PriGen.targets が要求する Microsoft.Build.Packaging.Pri.Tasks は
        # VS の MSBuild 配下にしかなく、dotnet SDK ディレクトリを探して MSB4062 で失敗する。
        # MSIX ジョブと同じく VS の msbuild を使う。
        uses: microsoft/setup-msbuild@v2

      - name: Publish (unpackaged, self-contained win-x64)
        # WindowsPackageType=None … MSIX を使わない「unpackaged」実行形態に切り替える
        #   （csproj は MSIX が既定。CLI のグローバルプロパティ上書きで、csproj を書き換えずに両形態を共存させる）。
        # WindowsAppSDKSelfContained=true … WinAppSDK ランタイムを出力へ同梱（配布先で Runtime インストール不要）。
        # SelfContained=true … .NET ランタイムも同梱。
        # Platform=x64 は windows-app-build.yml と同じ理由で必須（AnyCPU では apphost が作れない）。
        # PublishDir は working-directory(windows/) 絶対パス＝installer\MagiApp.iss の ..\publish\win-x64 と一致。
        shell: pwsh
        run: >
          msbuild MagiApp.WinUI/MagiApp.WinUI.csproj
          /restore /t:Publish
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:WindowsPackageType=None
          /p:WindowsAppSDKSelfContained=true
          /p:EnableMsixTooling=false
          /p:PublishDir=$PWD\publish\win-x64\

      - name: Bundle startup pieces the publish leaves out (resources.pri, VC++ runtime)
        # unpackaged WinUI 3 の起動に必須なのに /t:Publish が写さない2つを exe の隣へ置く: resources.pri（MakePri は
        # bin 側へ書く）と VC++ ランタイム DLL（WindowsAppSDKSelfContained は同梱しない。再頒布インストーラでなく
        # app-local にするのは per-user インストールと両立させるため）。欠ければ赤。経緯は windows/README.md の記録。
        shell: pwsh
        run: |
          $pub = "$PWD\publish\win-x64"
          # MakePri の出力名は MagiApp.WinUI.pri（-IndexName）。MRT Core は exe の隣の resources.pri を探すので改名して写す。
          # Microsoft.UI.Xaml.Controls.pri はアプリ PRI へ統合済みの部品索引なので候補から外す。
          $pri = Get-ChildItem "$PWD\MagiApp.WinUI\bin\x64\Release" -Recurse -Filter *.pri -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -like "*\win-x64\*" -and $_.Name -ne "Microsoft.UI.Xaml.Controls.pri" } |
                 Sort-Object { if ($_.Name -eq "MagiApp.WinUI.pri") { 0 } elseif ($_.Name -eq "resources.pri") { 1 } else { 2 } } |
                 Select-Object -First 1
          if (-not $pri) {
            Get-ChildItem "$PWD\MagiApp.WinUI" -Recurse -Filter *.pri -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  (pri) $($_.FullName)" }
            throw "app PRI (MagiApp.WinUI.pri / resources.pri) not found under MagiApp.WinUI\bin\x64\Release (MakePri output)"
          }
          Copy-Item $pri.FullName (Join-Path $pub "resources.pri") -Force
          Write-Host "resources.pri <- $($pri.FullName)"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "vswhere: Visual Studio not found" }
          # デスクトップ用 <ver>\x64\Microsoft.VC1xx.CRT を選ぶ（onecore・debug_nonredist は除外し、最も浅いパスを優先）。
          $crt = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC") -Directory -ErrorAction SilentlyContinue |
                 Sort-Object Name -Descending |
                 ForEach-Object { Get-ChildItem $_.FullName -Directory -Filter "Microsoft.VC*.CRT" -Recurse -ErrorAction SilentlyContinue |
                                  Where-Object { $_.FullName -like "*\x64\*" -and $_.FullName -notlike "*\onecore\*" -and $_.FullName -notlike "*\debug_nonredist\*" -and $_.Name -notlike "*Debug*" } |
                                  Sort-Object { $_.FullName.Length } } |
                 Select-Object -First 1
          if (-not $crt) { throw "VC++ CRT redist folder (x64\Microsoft.VC1xx.CRT) not found under $vs\VC\Redist\MSVC" }
          Write-Host "VC CRT <- $($crt.FullName)"
          $required = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          $optional = @("msvcp140_1.dll", "msvcp140_2.dll", "msvcp140_atomic_wait.dll", "msvcp140_codecvt_ids.dll", "concrt140.dll", "vccorlib140.dll")
          foreach ($f in $required + $optional) {
            $src = Join-Path $crt.FullName $f
            if (Test-Path $src) { Copy-Item $src $pub -Force; Write-Host "  + $f" }
            elseif ($required -contains $f) { throw "required VC runtime DLL missing in redist: $f" }
          }
          foreach ($f in @("resources.pri", "MagiApp.WinUI.exe", "Microsoft.ui.xaml.dll", "Microsoft.WindowsAppRuntime.dll") + $required) {
            if (-not (Test-Path (Join-Path $pub $f))) { throw "publish output is missing $f" }
          }
          Write-Host "publish root files: $((Get-ChildItem $pub -File).Count)"

      - name: Sign app binary (Authenticode; required when REQUIRE_CODE_SIGNING=true)
        # 二重署名構成の①: インストーラへ入れる前に「中身の MagiApp.WinUI.exe」を署名する
        # （setup.exe だけ署名しても展開後の本体が未署名だと SmartScreen/AV の評価が下がるため）。
        # Secrets: WINDOWS_CERTIFICATE_BASE64 / WINDOWS_CERTIFICATE_PASSWORD が無ければ何もせず成功
        # （署名なし配布＝従来どおり）。署名必須の run だけ失敗させる。詳細は installer/sign-files.ps1 と installer/README.md。
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./installer/sign-files.ps1 -Paths @("$PWD\publish\win-x64\MagiApp.WinUI.exe") -RequireSignature:($env:REQUIRE_SIGNING -eq 'true')

      - name: Build setup.exe (Inno Setup)
        shell: pwsh
        # 版は上で検証済みだが、スクリプト本文への式展開はやめ環境変数→引数として渡す（同じ理由）。
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found (Inno Setup 6 はランナー同梱のはず)" }
          $ver = $env:APP_VERSION
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: '$ver'" }
          & $iscc "/DAppVersion=$ver" `
                  /DPublishDir=..\publish\win-x64 `
                  /O"installer-out" `
                  installer\MagiApp.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem installer-out

      - name: Sign setup.exe (Authenticode; required when REQUIRE_CODE_SIGNING=true)
        # 二重署名構成の②: 生成されたセットアップファイル自体を署名（タイムスタンプ付き）。
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./installer/sign-files.ps1 -Paths @("$PWD\installer-out") -RequireSignature:($env:REQUIRE_SIGNING -eq 'true')

      - name: Upload artifact (setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: magi-windows-setup-exe
          path: windows/installer-out/*.exe
          retention-days: 14
          if-no-files-found: error

  release:
    name: GitHub Release (tag win-v* only)
    # setup.exe を Release に添付し、固定名の複製で releases/latest/download/… を常に最新にする。
    # 起動: タグ win-v* の push、または publish_release=true（gh release create --target がタグを打つ＝git のタグ push が使えない環境向け）。
    needs: installer-exe
    if: startsWith(github.ref, 'refs/tags/win-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: magi-windows-setup-exe
          path: dist
      - name: Attach setup.exe to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/win-v') && github.ref_name || format('win-v{0}', needs.installer-exe.outputs.version) }}
          TARGET_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SIGNED: ${{ vars.REQUIRE_CODE_SIGNING == 'true' }}
        run: |
          set -euo pipefail
          # 署名必須の run だけ「署名済み」と書く（署名なしの配布に署名済みと書かない）。
          if [ "$SIGNED" = "true" ]; then signing_note="Authenticode 署名済み"; else signing_note="証明書不要"; fi
          [[ "$TAG" =~ ^win-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG"; exit 1; }
          exe=$(ls dist/MagiShiftOptimizer-Setup-*-x64.exe | head -n 1)
          [ -n "$exe" ] || { echo "setup.exe not found in artifact"; exit 1; }
          cp "$exe" dist/MagiShiftOptimizer-Setup-x64.exe
          sha=$(sha256sum "$exe" | cut -d' ' -f1)
          cat > notes.md <<EOF_NOTES
          MAGI ShiftOptimizer Windows 11 版 ${TAG#win-v}（setup.exe・per-user・${signing_note}）

          **入れ方（PowerShell に貼り付け。SHA-256 を照合してから起動する）**
          \`\`\`powershell
          \$expected="${sha}"; \$f="\$env:TEMP\\MagiShiftOptimizer-Setup.exe"; curl.exe -L -o \$f https://github.com/${REPO}/releases/download/${TAG}/$(basename "$exe"); if ((Get-FileHash \$f -Algorithm SHA256).Hash.ToLowerInvariant() -ne \$expected) { throw "SHA-256 mismatch" }; Unblock-File \$f -ErrorAction SilentlyContinue; & \$f
          \`\`\`
          ブラウザで落とした場合は SmartScreen の「詳細情報」→「実行」の前に、上の SHA-256 と \`Get-FileHash\` の値を見比べる。詳細は windows/README.md。

          SHA-256: \`${sha}\`
          EOF_NOTES
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # 公開済みバージョンの実体は差し替えない: 同じタグが別のコミットから再実行されたら失敗させ、新しいバージョンを要求する。
            tag_sha=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')
            if [ "$(gh api "repos/$REPO/git/tags/$tag_sha" --jq '.object.sha' 2>/dev/null || echo "$tag_sha")" != "$TARGET_SHA" ]; then
              echo "tag $TAG already points at another commit ($tag_sha != $TARGET_SHA); bump the version instead of overwriting"; exit 1
            fi
            # 同じコミットの再実行: バージョン付き資産は既にあれば触らない（--clobber しない）。固定名の latest だけ更新する。
            if ! gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -qx "$(basename "$exe")"; then
              gh release upload "$TAG" "$exe" --repo "$REPO"
            fi
            gh release upload "$TAG" dist/MagiShiftOptimizer-Setup-x64.exe --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          else
            gh release create "$TAG" "$exe" dist/MagiShiftOptimizer-Setup-x64.exe --repo "$REPO" \
              --target "$TARGET_SHA" --title "Windows ${TAG#win-v}" --notes-file notes.md --latest
          fi
          gh release view "$TAG" --repo "$REPO"

  msix-package:
    name: MSIX package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        # MSIX パッケージ生成 (GenerateAppxPackageOnBuild) は dotnet CLI では駆動できず
        # Visual Studio の msbuild が必要（makeappx/signtool は Windows SDK 同梱）。
        uses: microsoft/setup-msbuild@v2

      - name: Package (MSIX, sideload)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.MSIX_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:PFX_B64)
          $hasPass = -not [string]::IsNullOrWhiteSpace($env:PFX_PASS)
          if ($hasPfx -ne $hasPass) { throw "MSIX_PFX_BASE64 と MSIX_PFX_PASSWORD は両方設定してください。" }
          $props = @(
            "/restore", "/p:Configuration=Release", "/p:Platform=x64",
            "/p:GenerateAppxPackageOnBuild=true",
            "/p:AppxPackageDir=$PWD\msix-out\",
            "/p:UapAppxPackageBuildMode=SideloadOnly",
            "/p:AppxBundle=Never"
          )
          # PFX はワークスペース外（RUNNER_TEMP）へ展開し、ビルドの成否に関わらず finally で消す（旧: $PWD\signing.pfx＝
          #   msbuild が失敗すると残ったまま。成果物の収集対象に混ざりうる）。
          $pfxPath = "$env:RUNNER_TEMP\magi-msix-$([Guid]::NewGuid().ToString('N')).pfx"
          if ($hasPfx) {
            Write-Host "署名あり（Secrets の PFX を使用）"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))
            $props += @(
              "/p:AppxPackageSigningEnabled=true",
              "/p:PackageCertificateKeyFile=$pfxPath",
              "/p:PackageCertificatePassword=$env:PFX_PASS"
            )
          } else {
            Write-Host "署名なし（Secrets: MSIX_PFX_BASE64 未設定）→ 未署名 .msix を生成"
            $props += "/p:AppxPackageSigningEnabled=false"
          }
          try {
            msbuild MagiApp.WinUI/MagiApp.WinUI.csproj @props
            if ($LASTEXITCODE -ne 0) { throw "MSIX build failed with exit code $LASTEXITCODE" }
          } finally {
            if (Test-Path $pfxPath) { Remove-Item $pfxPath -Force }
          }
          Get-ChildItem msix-out -Recurse | Select-Object FullName

      - name: Upload artifact (msix)
        uses: actions/upload-artifact@v4
        with:
          name: magi-windows-msix
          path: |
            windows/msix-out/**/*.msix
            windows/msix-out/**/*.cer
          retention-days: 14
          if-no-files-found: error
