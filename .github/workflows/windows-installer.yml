name: Windows Installer

# Windows 11 向けの「インストールできる成果物」を2形態で生成し Artifacts へ保存する。
#
#   ① installer-exe … Inno Setup 製の setup.exe（推奨・証明書不要）
#      WinUI3 を unpackaged（WindowsPackageType=None）＋ self-contained で publish し、
#      ランナー同梱の Inno Setup (ISCC.exe) で per-user インストーラに包む。
#      .NET / WindowsAppSDK ランタイム同梱＝配布先 PC に前提インストール不要。
#      署名なしでも実行可（初回に SmartScreen の「詳細情報→実行」が出るのは仕様）。
#      Secrets に WINDOWS_CERTIFICATE_BASE64 / WINDOWS_CERTIFICATE_PASSWORD があれば
#      signtool で Authenticode 二重署名（中身の .exe → setup.exe、タイムスタンプ付き）。
#
#   ② msix-package … MSIX サイドロードパッケージ（WinUI3 の正式なパッケージ形態）
#      Secrets に MSIX_PFX_BASE64 / MSIX_PFX_PASSWORD があれば署名付き .msix
#      （ダブルクリックでインストール可。証明書を配布先で1回信頼させる必要あり）。
#      Secrets が無ければ未署名 .msix（開発者モード＋PowerShell の
#      Add-AppxPackage でのみインストール可）を成果物にする。
#      注意: Package.appxmanifest の Publisher (CN=MAGI) と証明書 Subject は一致必須。
#      自己署名証明書の作成例（Windows 上の PowerShell・管理者不要）:
#        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=MAGI" `
#          -KeyUsage DigitalSignature -FriendlyName "MAGI sideload" `
#          -CertStoreLocation "Cert:\CurrentUser\My" `
#          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
#        Export-PfxCertificate -Cert $cert -FilePath magi.pfx `
#          -Password (ConvertTo-SecureString -String "<パスワード>" -Force -AsPlainText)
#        [Convert]::ToBase64String([IO.File]::ReadAllBytes("magi.pfx")) | Set-Clipboard
#      → クリップボードの文字列を Secrets: MSIX_PFX_BASE64 へ、パスワードを MSIX_PFX_PASSWORD へ。
#
# トリガは手動（workflow_dispatch）とリリースタグ（win-v*）のみ。
# 通常 push のビルド検証は windows-app-build.yml が担当（毎 push でインストーラまで
# 作ると windows ランナーの課金分数を浪費するため分離）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "インストーラのバージョン表記（空欄なら Package.appxmanifest の Version を使用）"
        required: false
        default: ""
  push:
    tags: ["win-v*"]

jobs:
  installer-exe:
    name: setup.exe (Inno Setup)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        # [レビュー指摘 2026-09-04] 旧: `$v = "${{ inputs.version }}"` と式展開でスクリプト本文へ埋めていた＝
        #   引用符や改行を含む入力で任意の PowerShell を実行できる（後続ステップが署名証明書を扱う）。
        #   入力は環境変数で受け取り、`X.Y.Z` 形式だけ通す。
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $v = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($v)) {
            [xml]$m = Get-Content MagiApp.WinUI/Package.appxmanifest
            # appxmanifest は 4 桁 (1.0.0.0)。インストーラ表記は 3 桁へ丸める。
            $v = ($m.Package.Identity.Version -replace '\.\d+$', '')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: '$v' (expected X.Y.Z)" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "installer version = $v"

      - name: Setup MSBuild
        # dotnet CLI では publish できない（run 33284484499 で実測）: WindowsAppSDK の
        # MrtCore.PriGen.targets が要求する Microsoft.Build.Packaging.Pri.Tasks は
        # VS の MSBuild 配下にしかなく、dotnet SDK ディレクトリを探して MSB4062 で失敗する。
        # MSIX ジョブと同じく VS の msbuild を使う。
        uses: microsoft/setup-msbuild@v2

      - name: Publish (unpackaged, self-contained win-x64)
        # WindowsPackageType=None … MSIX を使わない「unpackaged」実行形態に切り替える
        #   （csproj は MSIX が既定。CLI のグローバルプロパティ上書きで、csproj を書き換えずに両形態を共存させる）。
        # WindowsAppSDKSelfContained=true … WinAppSDK ランタイムを出力へ同梱（配布先で Runtime インストール不要）。
        # SelfContained=true … .NET ランタイムも同梱。
        # Platform=x64 は windows-app-build.yml と同じ理由で必須（AnyCPU では apphost が作れない）。
        # PublishDir は working-directory(windows/) 絶対パス＝installer\MagiApp.iss の ..\publish\win-x64 と一致。
        shell: pwsh
        run: >
          msbuild MagiApp.WinUI/MagiApp.WinUI.csproj
          /restore /t:Publish
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:WindowsPackageType=None
          /p:WindowsAppSDKSelfContained=true
          /p:EnableMsixTooling=false
          /p:PublishDir=$PWD\publish\win-x64\

      - name: Bundle startup pieces the publish leaves out (resources.pri, VC++ runtime)
        # [2026-09-04 実機報告「Windows11版が起動出来ない。画面でない」] run 33885296148 の publish 出力を
        #   数え直したところ、unpackaged WinUI 3 の起動に必須の2つが publish フォルダに無かった:
        #   ① resources.pri … MakePri は bin\x64\Release\...\win-x64\MagiApp.WinUI.pri へ書くが msbuild /t:Publish は
        #      PublishDir へ写さない。無いと XAML の初期化（App.xaml のリソース解決）で例外＝ウィンドウが出ずに終了する。
        #   ② Visual C++ ランタイム（vcruntime140/vcruntime140_1/msvcp140）… WindowsAppSDKSelfContained は
        #      WinAppSDK 自身の DLL しか同梱しない。VC++ 再頒布が入っていない PC では Microsoft.ui.xaml.dll が
        #      ロードできず、同じく無言で終了する。per-user インストール（昇格なし）と両立させるため、再頒布
        #      インストーラでなく app-local（exe の隣へ DLL を置く）で解決する。
        #   どちらも無ければジョブを赤にする（無言の欠落を二度と成果物にしない）。
        shell: pwsh
        run: |
          $pub = "$PWD\publish\win-x64"
          # MakePri の実際の出力名は "MagiApp.WinUI.pri"（-IndexName MagiApp.WinUI、run 33897806456 のログで確認。
          # resources.pri という名では書かれない）。unpackaged の MRT Core は exe の隣の resources.pri を探すので、
          # アプリ自身の PRI を見つけて resources.pri の名で写す。Microsoft.UI.Xaml.Controls.pri（WinUI の部品
          # インデックス。アプリ PRI へ統合済み）と obj 配下の中間物は候補から外す。
          $pri = Get-ChildItem "$PWD\MagiApp.WinUI\bin\x64\Release" -Recurse -Filter *.pri -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -like "*\win-x64\*" -and $_.Name -ne "Microsoft.UI.Xaml.Controls.pri" } |
                 Sort-Object { if ($_.Name -eq "MagiApp.WinUI.pri") { 0 } elseif ($_.Name -eq "resources.pri") { 1 } else { 2 } } |
                 Select-Object -First 1
          if (-not $pri) {
            Get-ChildItem "$PWD\MagiApp.WinUI" -Recurse -Filter *.pri -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  (pri) $($_.FullName)" }
            throw "app PRI (MagiApp.WinUI.pri / resources.pri) not found under MagiApp.WinUI\bin\x64\Release (MakePri output)"
          }
          Copy-Item $pri.FullName (Join-Path $pub "resources.pri") -Force
          Write-Host "resources.pri <- $($pri.FullName)"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "vswhere: Visual Studio not found" }
          # run 33898775401 では onecore\x64\Microsoft.VC145.CRT（OneCore 向け変種）が先に拾われた。デスクトップ Windows 用の
          # <ver>\x64\Microsoft.VC1xx.CRT を選ぶ（onecore / debug_nonredist(DebugCRT) は除外し、最も浅いパスを優先）。
          $crt = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC") -Directory -ErrorAction SilentlyContinue |
                 Sort-Object Name -Descending |
                 ForEach-Object { Get-ChildItem $_.FullName -Directory -Filter "Microsoft.VC*.CRT" -Recurse -ErrorAction SilentlyContinue |
                                  Where-Object { $_.FullName -like "*\x64\*" -and $_.FullName -notlike "*\onecore\*" -and $_.FullName -notlike "*\debug_nonredist\*" -and $_.Name -notlike "*Debug*" } |
                                  Sort-Object { $_.FullName.Length } } |
                 Select-Object -First 1
          if (-not $crt) { throw "VC++ CRT redist folder (x64\Microsoft.VC1xx.CRT) not found under $vs\VC\Redist\MSVC" }
          Write-Host "VC CRT <- $($crt.FullName)"
          $required = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          $optional = @("msvcp140_1.dll", "msvcp140_2.dll", "msvcp140_atomic_wait.dll", "msvcp140_codecvt_ids.dll", "concrt140.dll", "vccorlib140.dll")
          foreach ($f in $required + $optional) {
            $src = Join-Path $crt.FullName $f
            if (Test-Path $src) { Copy-Item $src $pub -Force; Write-Host "  + $f" }
            elseif ($required -contains $f) { throw "required VC runtime DLL missing in redist: $f" }
          }
          foreach ($f in @("resources.pri", "MagiApp.WinUI.exe", "Microsoft.ui.xaml.dll", "Microsoft.WindowsAppRuntime.dll") + $required) {
            if (-not (Test-Path (Join-Path $pub $f))) { throw "publish output is missing $f" }
          }
          Write-Host "publish root files: $((Get-ChildItem $pub -File).Count)"

      - name: Sign app binary (optional, Authenticode)
        # 二重署名構成の①: インストーラへ入れる前に「中身の MagiApp.WinUI.exe」を署名する
        # （setup.exe だけ署名しても展開後の本体が未署名だと SmartScreen/AV の評価が下がるため）。
        # Secrets: WINDOWS_CERTIFICATE_BASE64 / WINDOWS_CERTIFICATE_PASSWORD が無ければ何もせず成功
        # （署名なし配布＝従来どおり）。詳細は installer/sign-files.ps1 と installer/README.md。
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./installer/sign-files.ps1 -Paths @("$PWD\publish\win-x64\MagiApp.WinUI.exe")

      - name: Build setup.exe (Inno Setup)
        shell: pwsh
        # 版は上で検証済みだが、スクリプト本文への式展開はやめ環境変数→引数として渡す（同じ理由）。
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found (Inno Setup 6 はランナー同梱のはず)" }
          $ver = $env:APP_VERSION
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: '$ver'" }
          & $iscc "/DAppVersion=$ver" `
                  /DPublishDir=..\publish\win-x64 `
                  /O"installer-out" `
                  installer\MagiApp.iss
          Get-ChildItem installer-out

      - name: Sign setup.exe (optional, Authenticode)
        # 二重署名構成の②: 生成されたセットアップファイル自体を署名（タイムスタンプ付き）。
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./installer/sign-files.ps1 -Paths @("$PWD\installer-out")

      - name: Upload artifact (setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: magi-windows-setup-exe
          path: windows/installer-out/*.exe
          retention-days: 14
          if-no-files-found: error

  msix-package:
    name: MSIX package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        # MSIX パッケージ生成 (GenerateAppxPackageOnBuild) は dotnet CLI では駆動できず
        # Visual Studio の msbuild が必要（makeappx/signtool は Windows SDK 同梱）。
        uses: microsoft/setup-msbuild@v2

      - name: Package (MSIX, sideload)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.MSIX_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $props = @(
            "/restore", "/p:Configuration=Release", "/p:Platform=x64",
            "/p:GenerateAppxPackageOnBuild=true",
            "/p:AppxPackageDir=$PWD\msix-out\",
            "/p:UapAppxPackageBuildMode=SideloadOnly",
            "/p:AppxBundle=Never"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            Write-Host "署名あり（Secrets の PFX を使用）"
            [IO.File]::WriteAllBytes("$PWD\signing.pfx", [Convert]::FromBase64String($env:PFX_B64))
            $props += @(
              "/p:AppxPackageSigningEnabled=true",
              "/p:PackageCertificateKeyFile=$PWD\signing.pfx",
              "/p:PackageCertificatePassword=$env:PFX_PASS"
            )
          } else {
            Write-Host "署名なし（Secrets: MSIX_PFX_BASE64 未設定）→ 未署名 .msix を生成"
            $props += "/p:AppxPackageSigningEnabled=false"
          }
          msbuild MagiApp.WinUI/MagiApp.WinUI.csproj @props
          if (Test-Path "$PWD\signing.pfx") { Remove-Item "$PWD\signing.pfx" -Force }
          Get-ChildItem msix-out -Recurse | Select-Object FullName

      - name: Upload artifact (msix)
        uses: actions/upload-artifact@v4
        with:
          name: magi-windows-msix
          path: |
            windows/msix-out/**/*.msix
            windows/msix-out/**/*.cer
          retention-days: 14
          if-no-files-found: error
